name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # 2. Setup JDK 17
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Android SDK (manual - stabil)
      - name: 🔧 Setup Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi
          
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          
          echo "✅ Android SDK setup complete"

      # 4. Setup Gradle (GENERATE WRAPPER OTOMATIS)
      - name: 🔧 Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      # 5. Generate gradlew (kalau belum ada)
      - name: 🏗️ Generate Gradle Wrapper
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew tidak ditemukan, generate..."
            gradle wrapper --gradle-version 8.2
            echo "✅ gradlew berhasil dibuat"
          else
            echo "✅ gradlew sudah ada"
          fi
          chmod +x gradlew
          ls -la gradlew

      # 6. Buat local.properties
      - name: 📝 Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      # 7. Cache Gradle
      - name: 💾 Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Build Debug APK
      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 9. Build Release APK
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # 10. Upload Debug APK
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 11. Upload Release APK
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # 12. Auto-create Release
      - name: 🚀 Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            ## QR Pro v1.0.${{ github.run_number }}
            Build otomatis dari commit ${{ github.sha }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
